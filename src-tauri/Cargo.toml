[package]
name = "claude-fast"
version = "2.0.0"
description = "CC Desktop"
edition = "2021"

[lib]
name = "claude_fast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# app 内对话：生成新会话 id（--session-id）
uuid = { version = "1", features = ["v4"] }
tauri-plugin-autostart = "2.5.1"

# Windows 专用：ShellExecuteW 打开 cmd / explorer（macOS 用 open 命令，无需此依赖）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
